<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- pagina d'errore: Vercel la serve con lo stato 404 per ogni indirizzo che non esiste (noindex) -->
    <!-- seo:404 -->
    <!-- @head -->
    <noscript>
      <style>
        [data-reveal],
        [data-split],
        [data-rise] { visibility: visible !important; }
      </style>
    </noscript>
  </head>
  <body>
    <div class="page-sky" aria-hidden="true"></div>

    <!-- @nav -->
    <!-- @mnav -->

    <div class="grain" aria-hidden="true"></div>

    <main class="pmain">
      <div class="wrap">
        <header class="phead">
          <p class="mono eyebrow" data-reveal>
            <svg viewBox="0 0 26 24" aria-hidden="true"><path d="M7.2 2.5h11.6l5.6 9.5-5.6 9.5H7.2L1.6 12z" /></svg>
            Errore 404
          </p>
          <h1 class="display phead__title" aria-label="Pagina non trovata.">
            <span><span data-split="chars" aria-hidden="true">Pagina</span></span>
            <span>
              <span data-split="chars" data-delay="0.12" aria-hidden="true">non trovata</span>
              <svg class="hexdot" viewBox="0 0 26 24" aria-hidden="true"><path d="M7.2 2.5h11.6l5.6 9.5-5.6 9.5H7.2L1.6 12z" /></svg>
            </span>
          </h1>
          <div class="phead__row">
            <p class="phead__lead" data-reveal data-delay="0.3">
              <strong>L&rsquo;indirizzo non esiste o ha cambiato posto.</strong> Riparti dagli integratori Nutrex Lab o dalla homepage.
            </p>
          </div>
        </header>

        <section class="thanks" aria-label="Dove andare">
          <nav class="cats" aria-label="Categorie di integratori" data-rise>
            <a class="chip mono" href="/integratori">Tutti gli integratori</a>
            <a class="chip mono" href="/integratori/collagene">Collagene</a>
            <a class="chip mono" href="/integratori/vitamine-e-minerali">Vitamine e minerali</a>
            <a class="chip mono" href="/integratori/estratti-vegetali">Estratti vegetali</a>
          </nav>
          <div class="thanks__actions" data-rise>
            <a class="btn btn--xl" href="/integratori" data-magnetic>
              <span class="btn__label">Vai agli integratori</span><span class="btn__icon" aria-hidden="true">&rarr;</span>
            </a>
            <a class="btn btn--xl btn--ghost" href="/">
              <span class="btn__label">Homepage</span><span class="btn__icon" aria-hidden="true">&rarr;</span>
            </a>
          </div>
        </section>
      </div>
    </main>

    <!-- @footer -->

    <script type="module" src="/src/pages/legale.js"></script>
  </body>
</html>

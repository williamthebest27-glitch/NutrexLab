<!-- intestazione comune a tutte le pagine (src/partials/head.html) -->
<meta name="theme-color" content="#f1f0f3" />
<!-- icone: SVG per i browser attuali (e Google), .ico per chi lo chiede alla radice, PNG per iOS.
     sizes="32x32" sull'.ico: cosi' Chrome continua a scegliere l'SVG -->
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
  /* passaggio tra le pagine: dissolvenza incrociata (nei browser che la supportano). Qui e non nel CSS
     del sito: la pagina nuova deve aderire gia' dal primo disegno */
  @view-transition {
    navigation: auto;
  }
  ::view-transition-old(root),
  ::view-transition-new(root) {
    animation-duration: 0.42s;
    animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    @view-transition {
      navigation: none;
    }
  }
</style>
<script>
  // lingua della pagina (src/i18n/langs.js): quella dell'indirizzo (/de/...), di ?lang= o, senza prefisso,
  // quella scelta in passato (cookie nx_lang). Se non e' quella in cui e' scritto l'HTML (data-src-lang) i testi
  // restano nascosti finche' non sono tradotti, cosi' non si vede l'altra lingua per un attimo (al massimo
  // 4 secondi, poi si mostrano comunque)
  ;(function () {
    var h = document.documentElement
    var re = /^(it|en|fr|de|es)$/
    try {
      var src = h.getAttribute('data-src-lang') || 'it'
      var m = /^\/(en|fr|de|es)(\/|$)/.exec(location.pathname)
      var l = new URLSearchParams(location.search).get('lang')
      if (!re.test(l || '')) l = m ? m[1] : null
      if (!l) {
        var c = /(?:^|;\s*)nx_lang=([a-z]{2})/.exec(document.cookie)
        l = c ? c[1] : localStorage.getItem('nx_lang')
      }
      if (!re.test(l || '')) l = 'it'
      if (l !== src) {
        h.lang = l
        h.classList.add('i18n-wait')
        setTimeout(function () {
          h.classList.remove('i18n-wait')
        }, 4000)
      }
    } catch (e) {}
  })()
</script>
<style>
  html.i18n-wait [data-i18n],
  html.i18n-wait [data-i18n-text],
  html.i18n-wait [data-i18n-wait] {
    visibility: hidden !important;
  }
</style>
<script>
  // se il browser interrompe la dissolvenza (finestra ridimensionata, navigazione veloce) non e' un errore
  ;['pageswap', 'pagereveal'].forEach(function (type) {
    addEventListener(type, function (e) {
      var v = e.viewTransition
      if (v) [v.ready, v.finished, v.updateCallbackDone].forEach(function (p) { if (p) p.catch(function () {}) })
    })
  })
</script>

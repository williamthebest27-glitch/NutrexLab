<!-- intestazione comune a tutte le pagine (src/partials/head.html) -->
<meta name="theme-color" content="#f1f0f3" />
<!-- icone: SVG per i browser attuali (e Google), .ico per chi lo chiede alla radice, PNG per iOS.
     sizes="32x32" sull'.ico: cosi' Chrome continua a scegliere l'SVG -->
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
  /* passaggio tra le pagine: dissolvenza incrociata (nei browser che la supportano). Qui e non nel CSS
     del sito: la pagina nuova deve aderire gia' dal primo disegno */
  @view-transition {
    navigation: auto;
  }
  ::view-transition-old(root),
  ::view-transition-new(root) {
    animation-duration: 0.42s;
    animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    @view-transition {
      navigation: none;
    }
  }
</style>
<script>
  // se il browser interrompe la dissolvenza (finestra ridimensionata, navigazione veloce) non e' un errore
  ;['pageswap', 'pagereveal'].forEach(function (type) {
    addEventListener(type, function (e) {
      var v = e.viewTransition
      if (v) [v.ready, v.finished, v.updateCallbackDone].forEach(function (p) { if (p) p.catch(function () {}) })
    })
  })
</script>

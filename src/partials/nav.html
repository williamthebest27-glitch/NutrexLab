<!-- navbar comune a tutte le pagine (src/partials/nav.html). Le voci con data-goto nella homepage
     scorrono fino alla scena (main.js), nelle altre pagine sono link normali -->
<header class="nav" data-nav>
  <span class="nav__bg" aria-hidden="true"></span>
  <a class="nav__logo" href="/" data-goto="top" aria-label="Nutrex Lab, homepage" data-i18n-attr="aria-label">
    <span data-logo>NUTREX LAB</span>
  </a>
  <nav class="nav__links" aria-label="Principale" data-i18n-attr="aria-label">
    <a class="nav-link" href="/" data-goto="top" data-nav-link data-i18n-text>Homepage</a>
    <!-- Acquista: passando con il mouse (o con la freccia) si apre il sottomenu Negozio / Carrello
         (src/ui/navMenu.js); il numero e' quello dei prodotti nel carrello -->
    <div class="nav-item" data-nav-sub>
      <a class="nav-link" href="/integratori" data-nav-link data-i18n-text>Acquista</a>
      <span class="nav-badge mono" data-cart-count hidden>0</span>
      <button class="nav-item__more" type="button" aria-expanded="false" aria-controls="nav-sub-acquista" aria-label="Apri il sottomenu: negozio e carrello" data-i18n-attr="aria-label">
        <svg viewBox="0 0 12 8" aria-hidden="true"><path d="M1.5 1.75 6 6.25l4.5-4.5" /></svg>
      </button>
      <div class="nav-sub" id="nav-sub-acquista">
        <div class="nav-sub__card">
          <a class="nav-sub__link" href="/integratori">
            <span class="nav-sub__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4.2 9.4 5.8 4.6h12.4l1.6 4.8" /><path d="M4.2 9.4h15.6a2.6 2.6 0 0 1-5.2 0 2.6 2.6 0 0 1-5.2 0 2.6 2.6 0 0 1-5.2 0z" /><path d="M5.6 12.4v7.2h12.8v-7.2M10.2 19.6v-4.4h3.6v4.4" /></svg>
            </span>
            <span class="nav-sub__text"><span class="nav-sub__t" data-i18n>Negozio</span><span class="nav-sub__d" data-i18n>Tutti i prodotti Nutrex Lab</span></span>
            <span class="nav-sub__arrow" aria-hidden="true">&rarr;</span>
          </a>
          <a class="nav-sub__link" href="/carrello">
            <span class="nav-sub__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5.6 8.6h12.8l-1.05 10.9a1.6 1.6 0 0 1-1.6 1.45H8.25a1.6 1.6 0 0 1-1.6-1.45z" /><path d="M9 8.6V7.2a3 3 0 0 1 6 0v1.4" /></svg>
            </span>
            <span class="nav-sub__text"><span class="nav-sub__t" data-i18n>Carrello</span><span class="nav-sub__d" data-i18n>I prodotti che hai scelto</span></span>
            <span class="nav-sub__count mono" data-cart-count="always">0</span>
          </a>
        </div>
      </div>
    </div>
    <a class="nav-link" href="/contatti" data-nav-link data-i18n-text>Contatti</a>
  </nav>
  <div class="nav__right">
    <!-- lingua del sito (src/i18n/picker.js): bandiera e sigla, si apre l'elenco delle lingue -->
    <div class="lang" data-lang-picker>
      <button class="lang__btn" type="button" aria-expanded="false" aria-controls="lang-menu" aria-haspopup="true">
        <svg class="lang__flag" viewBox="0 0 30 20" aria-hidden="true"><use href="#flag-it" data-lang-flag /></svg>
        <span class="lang__code mono" data-lang-code>IT</span>
        <svg class="lang__chev" viewBox="0 0 12 8" aria-hidden="true"><path d="M1.5 1.75 6 6.25l4.5-4.5" /></svg>
      </button>
      <div class="lang__menu" id="lang-menu">
        <ul class="lang__card" role="list">
          <li><button class="lang__opt" type="button" data-lang="it" lang="it"><svg class="lang__flag" viewBox="0 0 30 20" aria-hidden="true"><use href="#flag-it" /></svg><span>Italiano</span></button></li>
          <li><button class="lang__opt" type="button" data-lang="en" lang="en"><svg class="lang__flag" viewBox="0 0 30 20" aria-hidden="true"><use href="#flag-en" /></svg><span>English</span></button></li>
          <li><button class="lang__opt" type="button" data-lang="fr" lang="fr"><svg class="lang__flag" viewBox="0 0 30 20" aria-hidden="true"><use href="#flag-fr" /></svg><span>Fran&ccedil;ais</span></button></li>
          <li><button class="lang__opt" type="button" data-lang="de" lang="de"><svg class="lang__flag" viewBox="0 0 30 20" aria-hidden="true"><use href="#flag-de" /></svg><span>Deutsch</span></button></li>
          <li><button class="lang__opt" type="button" data-lang="es" lang="es"><svg class="lang__flag" viewBox="0 0 30 20" aria-hidden="true"><use href="#flag-es" /></svg><span>Espa&ntilde;ol</span></button></li>
        </ul>
      </div>
      <!-- bandiere (anche per la miniatura dell'etichetta nella pagina prodotto) -->
      <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <symbol id="flag-it" viewBox="0 0 30 20"><rect width="10" height="20" fill="#009246" /><rect x="10" width="10" height="20" fill="#f4f5f0" /><rect x="20" width="10" height="20" fill="#ce2b37" /></symbol>
        <symbol id="flag-fr" viewBox="0 0 30 20"><rect width="10" height="20" fill="#002654" /><rect x="10" width="10" height="20" fill="#f4f5f0" /><rect x="20" width="10" height="20" fill="#ce1126" /></symbol>
        <symbol id="flag-de" viewBox="0 0 30 20"><rect width="30" height="6.67" fill="#111" /><rect y="6.67" width="30" height="6.67" fill="#dd0000" /><rect y="13.33" width="30" height="6.67" fill="#ffce00" /></symbol>
        <symbol id="flag-es" viewBox="0 0 30 20"><rect width="30" height="20" fill="#aa151b" /><rect y="5" width="30" height="10" fill="#f1bf00" /></symbol>
        <defs><clipPath id="flag-en-t"><path d="M30 15h30v15zv15H0zH0V0zV0h30z" /></clipPath></defs>
        <symbol id="flag-en" viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice"><path d="M0 0v30h60V0z" fill="#012169" /><path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6" /><path d="M0 0l60 30m0-30L0 30" clip-path="url(#flag-en-t)" stroke="#c8102e" stroke-width="4" /><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10" /><path d="M30 0v30M0 15h60" stroke="#c8102e" stroke-width="6" /></symbol>
      </svg>
    </div>
    <a class="btn btn--sm nav__cta" href="/integratori" data-magnetic>
      <span class="btn__label" data-i18n>Acquista ora</span><span class="btn__icon" aria-hidden="true">&rarr;</span>
    </a>
    <!-- solo desktop: il pulsante rotondo dell'area clienti (su mobile Account sta nel menu hamburger) -->
    <a class="nav__account" href="/account" aria-label="Il tuo account" data-i18n-attr="aria-label">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.2" r="3.6" /><path d="M5 20.2c.7-3.6 3.5-5.6 7-5.6s6.3 2 7 5.6" /></svg>
    </a>
  </div>
  <!-- solo mobile: apre il menu con le pagine (src/ui/mobileMenu.js) -->
  <button class="nav__burger" type="button" aria-label="Apri il menu" aria-expanded="false" aria-controls="mnav" data-mnav-toggle data-i18n-attr="aria-label">
    <span class="nav__burger-box" aria-hidden="true"><i></i><i></i></span>
  </button>
</header>

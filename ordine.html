<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Grazie | Nutrex Lab</title>
    <meta name="description" content="Ordine Nutrex Lab ricevuto." />
    <meta name="robots" content="noindex" />
    <!-- @head -->
    <noscript>
      <style>
        [data-reveal],
        [data-split],
        [data-rise] { visibility: visible !important; }
      </style>
    </noscript>
  </head>
  <body>
    <div class="page-sky" aria-hidden="true"></div>

    <!-- @nav -->
    <!-- @mnav -->

    <div class="grain" aria-hidden="true"></div>

    <main class="pmain">
      <div class="wrap">
        <header class="phead">
          <p class="mono eyebrow" data-reveal>
            <svg viewBox="0 0 26 24" aria-hidden="true"><path d="M7.2 2.5h11.6l5.6 9.5-5.6 9.5H7.2L1.6 12z" /></svg>
            <span data-i18n>Ordine ricevuto</span>
          </p>
          <h1 class="display phead__title" aria-label="Grazie." data-i18n-attr="aria-label">
            <span>
              <span data-split="chars" aria-hidden="true" data-i18n>Grazie</span>
              <svg class="hexdot" viewBox="0 0 26 24" aria-hidden="true"><path d="M7.2 2.5h11.6l5.6 9.5-5.6 9.5H7.2L1.6 12z" /></svg>
            </span>
          </h1>
        </header>

        <section class="thanks" aria-label="Conferma dell'ordine" data-i18n-attr="aria-label">
          <p class="mono thanks__number" data-rise data-number hidden><span data-i18n>Ordine n.</span> <b data-number-value></b></p>
          <p class="thanks__text" data-rise data-i18n>
            Il tuo ordine &egrave; stato ricevuto. Ti abbiamo inviato un'email con il riepilogo; quando parte la spedizione
            riceverai anche il codice per seguirla.
          </p>
          <div class="thanks__actions" data-rise>
            <a class="btn btn--xl" href="/integratori" data-magnetic>
              <span class="btn__label" data-i18n>Torna al negozio</span><span class="btn__icon" aria-hidden="true">&rarr;</span>
            </a>
            <a class="btn btn--xl btn--ghost" href="/">
              <span class="btn__label" data-i18n>Homepage</span><span class="btn__icon" aria-hidden="true">&rarr;</span>
            </a>
          </div>
        </section>
      </div>
    </main>

    <!-- @footer -->

    <script type="module" src="/src/pages/ordine.js"></script>
  </body>
</html>

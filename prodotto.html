<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Prodotto | Nutrex Lab</title>
    <!-- @head -->
    <!-- titolo, descrizione, canonical, Open Graph e dati strutturati li aggiunge il server (api/product-page.js) -->
    <noscript>
      <style>
        [data-reveal],
        [data-split],
        [data-rise],
        .pseo { visibility: visible !important; }
      </style>
    </noscript>
  </head>
  <body>
    <div class="page-sky" aria-hidden="true"></div>

    <!-- @nav -->
    <!-- @mnav -->

    <div class="grain" aria-hidden="true"></div>

    <main class="pmain">
      <div class="wrap">
        <div class="pp" data-pp>
          <!-- ssr:prodotto -->
        </div>
      </div>
    </main>

    <!-- sipario scuro con il bordo curvo, come nella homepage -->
    <section class="band" data-nav-dark aria-labelledby="qualita">
      <svg class="band__cap" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0Q50 20 100 0V10.6H0z" /></svg>
      <div class="band__body">
        <div class="wrap">
          <h2 class="display band__title" id="qualita" data-split="chars">La qualit&agrave;<br /><em>in ogni barattolo.</em></h2>
          <div class="band__grid">
            <div class="band__item" data-reveal>
              <span class="band__icon" aria-hidden="true"><span class="flag"><i></i><i></i><i></i></span></span>
              <h3>Prodotto in Italia</h3>
              <p>Tutti gli integratori della linea sono prodotti in Italia.</p>
            </div>
            <div class="band__item" data-reveal data-delay="0.1">
              <span class="band__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 3.2 19 6v5.4c0 4.3-2.9 7.9-7 9.4-4.1-1.5-7-5.1-7-9.4V6z" /><path d="m8.8 12.2 2.2 2.2 4.4-4.6" /></svg>
              </span>
              <h3>GMP / ISO 9001</h3>
              <p>Standard di qualit&agrave; nella produzione.</p>
            </div>
            <div class="band__item" data-reveal data-delay="0.2">
              <span class="band__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.4" /><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" /><path d="M12 14.4v2.4" /></svg>
              </span>
              <h3>Sigillo di garanzia</h3>
              <p>Ogni barattolo resta integro fino all'apertura.</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- @footer -->

    <!-- carrello sempre a portata: compare dopo un'aggiunta -->
    <div class="dock" data-dock inert>
      <div class="dock__in">
        <div class="dock__thumbs" data-dock-thumbs></div>
        <div class="dock__text">
          <span class="mono dock__label" data-dock-label>Carrello</span>
          <span class="dock__what" data-dock-what></span>
        </div>
        <a class="btn btn--sm" href="/carrello">
          <span class="btn__label"><span class="dock__long">Vai al </span>carrello</span><span class="btn__icon" aria-hidden="true">&rarr;</span>
        </a>
      </div>
    </div>

    <script type="module" src="/src/pages/prodotto.js"></script>
  </body>
</html>

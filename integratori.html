<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- titolo, descrizione, canonical, Open Graph e dati strutturati: src/seo/pages.js ("integratori") -->
    <!-- seo:integratori -->
    <!-- @head -->
    <noscript>
      <style>
        [data-reveal],
        [data-split],
        [data-rise] { visibility: visible !important; }
      </style>
    </noscript>
  </head>
  <body>
    <div class="page-sky" aria-hidden="true"></div>

    <!-- @nav -->
    <!-- @mnav -->

    <div class="grain" aria-hidden="true"></div>

    <main class="pmain" data-catalog="tutti">
      <div class="wrap">
        <header class="phead">
          <p class="mono eyebrow" data-reveal>
            <svg viewBox="0 0 26 24" aria-hidden="true"><path d="M7.2 2.5h11.6l5.6 9.5-5.6 9.5H7.2L1.6 12z" /></svg>
            Acquista &middot; La linea Nutrex Lab
          </p>
          <h1 class="display phead__title" aria-label="Scegli il tuo prodotto.">
            <span><span data-split="chars" aria-hidden="true">Scegli il tuo</span></span>
            <span>
              <span data-split="chars" data-delay="0.12" aria-hidden="true">prodotto</span>
              <svg class="hexdot" viewBox="0 0 26 24" aria-hidden="true"><path d="M7.2 2.5h11.6l5.6 9.5-5.6 9.5H7.2L1.6 12z" /></svg>
            </span>
          </h1>
          <div class="phead__row">
            <p class="phead__lead" data-reveal data-delay="0.3">
              <strong>Integratori prodotti in Italia.</strong> Polvere, compresse e capsule: ognuno con la sua formula,
              per il tuo benessere di ogni giorno.
            </p>
          </div>
        </header>

        <div class="rule" data-rule></div>

        <!-- categorie (link alle pagine /integratori/<categoria>, come nelle pagine categoria), conteggio, filtri -->
        <div class="toolbar">
          <!-- categorie:tutti -->
          <p class="mono toolbar__count" aria-live="polite" data-count></p>
          <div class="filters" role="group" aria-label="Filtra per formato" data-filters></div>
        </div>

        <!-- schede gia' nella pagina (nome, descrizione, foto e link: le leggono anche i motori di ricerca),
             aggiornate dal browser con i dati di WooCommerce (src/pages/acquista.js) -->
        <ul class="pgrid" data-grid aria-label="Prodotti" aria-busy="true">
          <!-- griglia:tutti -->
        </ul>
        <noscript><p class="phead__lead">Per usare il carrello attiva JavaScript.</p></noscript>

        <!-- domande frequenti: testi in src/seo/catalog.js (SHOP.faq), gli stessi dei dati strutturati -->
        <!-- faq:integratori -->
      </div>
    </main>

    <!-- @band -->

    <!-- @footer -->

    <!-- carrello sempre a portata: compare appena c'e' un prodotto -->
    <!-- @dock -->

    <script type="module" src="/src/pages/acquista.js"></script>
  </body>
</html>
